name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Note: package-lock.json is gitignored in this repo, so we use `npm install`
# (not `npm ci`) and skip the lockfile-based npm cache.

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test

  build-and-audit:
    name: Build + Lighthouse
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Serve dist/
        run: |
          npx --yes http-server dist -p 8080 -c-1 &
          sleep 3
          curl -fsS http://localhost:8080/index.html > /dev/null

      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:8080/index.html
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  capture-screenshots:
    name: Capture 20 screenshots
    runs-on: ubuntu-latest
    needs: build-and-audit
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Capture
        run: npm run capture

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 30
